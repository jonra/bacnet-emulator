spring:
  application:
    name: bacnet-emulator
  
  datasource:
    url: jdbc:h2:file:./data/bacnet-emulator
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    mode: HTML

server:
  port: 8080

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha

bacnet:
  network:
    port: 47808
    bind-address: 0.0.0.0
    broadcast-address: 255.255.255.255
  device:
    default-instance-id: 1000
  behavior:
    default-response-delay-ms: 0
    enable-error-simulation: false

logging:
  level:
    com.bacnet.emulator: DEBUG
    org.springframework.web: INFO
