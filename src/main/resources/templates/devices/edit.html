<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Device - BACnet Emulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 sidebar p-3" style="min-height: 100vh; background-color: #f8f9fa;">
                <h4 class="mb-4">
                    <i class="bi bi-router"></i> BACnet Emulator
                </h4>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/devices}">
                            <i class="bi bi-device-hdd"></i> Devices
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/objects}">
                            <i class="bi bi-list-ul"></i> Objects
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/network/config}">
                            <i class="bi bi-wifi"></i> Network Config
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/monitor/logs}">
                            <i class="bi bi-journal-text"></i> Logs
                        </a>
                    </li>
                </ul>
            </nav>
            <main class="col-md-10 p-4">
                <h1 class="mb-4">Edit Device</h1>
                
                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/devices/{id}/edit(id=${device.id})}" th:object="${device}" method="post">
                            <div class="mb-3">
                                <label for="deviceInstanceId" class="form-label">Device Instance ID *</label>
                                <input type="number" class="form-control" id="deviceInstanceId" 
                                       th:field="*{deviceInstanceId}" required min="1">
                                <div th:if="${#fields.hasErrors('deviceInstanceId')}" class="text-danger">
                                    <span th:errors="*{deviceInstanceId}"></span>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="deviceName" class="form-label">Device Name *</label>
                                <input type="text" class="form-control" id="deviceName" 
                                       th:field="*{deviceName}" required>
                                <div th:if="${#fields.hasErrors('deviceName')}" class="text-danger">
                                    <span th:errors="*{deviceName}"></span>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="vendorId" class="form-label">Vendor ID</label>
                                <input type="text" class="form-control" id="vendorId" 
                                       th:field="*{vendorId}">
                            </div>
                            
                            <div class="mb-3">
                                <label for="modelName" class="form-label">Model Name</label>
                                <input type="text" class="form-control" id="modelName" 
                                       th:field="*{modelName}">
                            </div>
                            
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" rows="3" 
                                          th:field="*{description}"></textarea>
                            </div>
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="enabled" 
                                       th:field="*{enabled}">
                                <label class="form-check-label" for="enabled">
                                    Enabled
                                </label>
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Update Device</button>
                            <a th:href="@{/devices}" class="btn btn-secondary">Cancel</a>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
