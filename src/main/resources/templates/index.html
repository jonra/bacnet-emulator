<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BACnet Emulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .stat-card {
            border-left: 4px solid #0d6efd;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 sidebar p-3" style="min-height: 100vh; background-color: #f8f9fa;">
                <h4 class="mb-4">
                    <i class="bi bi-router"></i> BACnet Emulator
                </h4>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/}">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/devices}">
                            <i class="bi bi-device-hdd"></i> Devices
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/objects}">
                            <i class="bi bi-list-ul"></i> Objects
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/network/config}">
                            <i class="bi bi-wifi"></i> Network Config
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/monitor/logs}">
                            <i class="bi bi-journal-text"></i> Logs
                        </a>
                    </li>
                </ul>
            </nav>
            <main class="col-md-10 p-4">
                <h1 class="mb-4">Dashboard</h1>
                
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card stat-card">
                            <div class="card-body">
                                <h5 class="card-title">
                                    <i class="bi bi-device-hdd"></i> Total Devices
                                </h5>
                                <h2 class="text-primary" th:text="${totalDevices}">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stat-card">
                            <div class="card-body">
                                <h5 class="card-title">
                                    <i class="bi bi-check-circle"></i> Enabled Devices
                                </h5>
                                <h2 class="text-success" th:text="${enabledDevices}">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stat-card">
                            <div class="card-body">
                                <h5 class="card-title">
                                    <i class="bi bi-list-ul"></i> Total Objects
                                </h5>
                                <h2 class="text-info" th:text="${totalObjects}">0</h2>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h5>Quick Actions</h5>
                            </div>
                            <div class="card-body">
                                <a th:href="@{/devices/create}" class="btn btn-primary me-2">
                                    <i class="bi bi-plus-circle"></i> Create Device
                                </a>
                                <a th:href="@{/objects/create}" class="btn btn-primary me-2">
                                    <i class="bi bi-plus-circle"></i> Create Object
                                </a>
                                <a th:href="@{/monitor/logs}" class="btn btn-secondary">
                                    <i class="bi bi-journal-text"></i> View Logs
                                </a>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h5>System Status</h5>
                            </div>
                            <div class="card-body">
                                <p><i class="bi bi-circle-fill text-success"></i> BACnet Service: Running</p>
                                <p><i class="bi bi-circle-fill text-success"></i> Database: Connected</p>
                                <p><i class="bi bi-circle-fill text-success"></i> Web Server: Active</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
