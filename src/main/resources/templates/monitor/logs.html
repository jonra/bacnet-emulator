<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs - BACnet Emulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .log-entry {
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        .log-info { color: #0d6efd; }
        .log-warn { color: #ffc107; }
        .log-error { color: #dc3545; }
        .log-debug { color: #6c757d; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 sidebar p-3" style="min-height: 100vh; background-color: #f8f9fa;">
                <h4 class="mb-4">
                    <i class="bi bi-router"></i> BACnet Emulator
                </h4>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/devices}">
                            <i class="bi bi-device-hdd"></i> Devices
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/objects}">
                            <i class="bi bi-list-ul"></i> Objects
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/network/config}">
                            <i class="bi bi-wifi"></i> Network Config
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/monitor/logs}">
                            <i class="bi bi-journal-text"></i> Logs
                        </a>
                    </li>
                </ul>
            </nav>
            <main class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1>BACnet Activity Logs</h1>
                    <button class="btn btn-secondary" onclick="location.reload()">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                </div>
                
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-sm">
                                <thead>
                                    <tr>
                                        <th>Timestamp</th>
                                        <th>Level</th>
                                        <th>Service</th>
                                        <th>Source</th>
                                        <th>Device</th>
                                        <th>Object</th>
                                        <th>Message</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="log : ${logs}" class="log-entry">
                                        <td th:text="${#temporals.format(log.timestamp, 'yyyy-MM-dd HH:mm:ss')}"></td>
                                        <td>
                                            <span th:classappend="'log-' + ${log.logLevel.toLowerCase()}" 
                                                  th:text="${log.logLevel}"></span>
                                        </td>
                                        <td th:text="${log.serviceType ?: 'N/A'}"></td>
                                        <td th:text="${log.sourceAddress ?: 'N/A'}"></td>
                                        <td th:text="${log.deviceInstanceId ?: 'N/A'}"></td>
                                        <td th:if="${log.objectType != null and log.objectInstance != null}"
                                            th:text="${log.objectType + ':' + log.objectInstance}"></td>
                                        <td th:unless="${log.objectType != null and log.objectInstance != null}">N/A</td>
                                        <td th:text="${log.message}"></td>
                                    </tr>
                                    <tr th:if="${logs.isEmpty()}">
                                        <td colspan="7" class="text-center text-muted">No logs available</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
