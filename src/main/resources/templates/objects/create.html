<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Object - BACnet Emulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 sidebar p-3" style="min-height: 100vh; background-color: #f8f9fa;">
                <h4 class="mb-4">
                    <i class="bi bi-router"></i> BACnet Emulator
                </h4>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/devices}">
                            <i class="bi bi-device-hdd"></i> Devices
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/objects}">
                            <i class="bi bi-list-ul"></i> Objects
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/network/config}">
                            <i class="bi bi-wifi"></i> Network Config
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/monitor/logs}">
                            <i class="bi bi-journal-text"></i> Logs
                        </a>
                    </li>
                </ul>
            </nav>
            <main class="col-md-10 p-4">
                <h1 class="mb-4">Create Object</h1>
                
                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/objects/create}" th:object="${object}" method="post">
                            <div class="mb-3">
                                <label for="deviceId" class="form-label">Device *</label>
                                <select class="form-select" id="deviceId" th:field="*{deviceId}" required>
                                    <option value="">Select a device</option>
                                    <option th:each="device : ${devices}" 
                                            th:value="${device.id}" 
                                            th:text="${device.deviceName + ' (' + device.deviceInstanceId + ')'}"></option>
                                </select>
                                <div th:if="${#fields.hasErrors('deviceId')}" class="text-danger">
                                    <span th:errors="*{deviceId}"></span>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="objectType" class="form-label">Object Type *</label>
                                <select class="form-select" id="objectType" th:field="*{objectType}" required>
                                    <option value="">Select object type</option>
                                    <option th:each="entry : ${objectTypes}" 
                                            th:value="${entry.key}" 
                                            th:text="${entry.value}"></option>
                                </select>
                                <div th:if="${#fields.hasErrors('objectType')}" class="text-danger">
                                    <span th:errors="*{objectType}"></span>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="objectInstance" class="form-label">Object Instance *</label>
                                <input type="number" class="form-control" id="objectInstance" 
                                       th:field="*{objectInstance}" required min="1">
                                <div th:if="${#fields.hasErrors('objectInstance')}" class="text-danger">
                                    <span th:errors="*{objectInstance}"></span>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="objectName" class="form-label">Object Name *</label>
                                <input type="text" class="form-control" id="objectName" 
                                       th:field="*{objectName}" required>
                                <div th:if="${#fields.hasErrors('objectName')}" class="text-danger">
                                    <span th:errors="*{objectName}"></span>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="presentValue" class="form-label">Present Value</label>
                                <input type="text" class="form-control" id="presentValue" 
                                       th:field="*{presentValue}" placeholder="0 or false">
                            </div>
                            
                            <div class="mb-3">
                                <label for="units" class="form-label">Units (for analog objects)</label>
                                <input type="text" class="form-control" id="units" 
                                       th:field="*{units}" placeholder="e.g., degreesCelsius, percent">
                            </div>
                            
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" rows="3" 
                                          th:field="*{description}"></textarea>
                            </div>
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="writable" 
                                       th:field="*{writable}">
                                <label class="form-check-label" for="writable">
                                    Writable
                                </label>
                            </div>
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="covEnabled" 
                                       th:field="*{covEnabled}">
                                <label class="form-check-label" for="covEnabled">
                                    COV Enabled
                                </label>
                            </div>
                            
                            <div class="mb-3">
                                <label for="covIncrement" class="form-label">COV Increment (for analog objects)</label>
                                <input type="number" step="0.01" class="form-control" id="covIncrement" 
                                       th:field="*{covIncrement}">
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Create Object</button>
                            <a th:href="@{/objects}" class="btn btn-secondary">Cancel</a>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
