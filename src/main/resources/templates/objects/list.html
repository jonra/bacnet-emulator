<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objects - BACnet Emulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 sidebar p-3" style="min-height: 100vh; background-color: #f8f9fa;">
                <h4 class="mb-4">
                    <i class="bi bi-router"></i> BACnet Emulator
                </h4>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/devices}">
                            <i class="bi bi-device-hdd"></i> Devices
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/objects}">
                            <i class="bi bi-list-ul"></i> Objects
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/network/config}">
                            <i class="bi bi-wifi"></i> Network Config
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/monitor/logs}">
                            <i class="bi bi-journal-text"></i> Logs
                        </a>
                    </li>
                </ul>
            </nav>
            <main class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1>Objects</h1>
                    <a th:href="@{/objects/create}" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> Create Object
                    </a>
                </div>
                
                <div class="card mb-3">
                    <div class="card-body">
                        <form method="get" action="/objects">
                            <div class="row">
                                <div class="col-md-4">
                                    <select name="deviceId" class="form-select">
                                        <option value="">All Devices</option>
                                        <option th:each="device : ${devices}" 
                                                th:value="${device.id}" 
                                                th:text="${device.deviceName + ' (' + device.deviceInstanceId + ')'}"
                                                th:selected="${deviceId != null && deviceId == device.id}"></option>
                                    </select>
                                </div>
                                <div class="col-md-2">
                                    <button type="submit" class="btn btn-secondary">Filter</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Device</th>
                                    <th>Type</th>
                                    <th>Instance</th>
                                    <th>Name</th>
                                    <th>Present Value</th>
                                    <th>Writable</th>
                                    <th>COV</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="object : ${objects}">
                                    <td th:text="${object.deviceName}"></td>
                                    <td th:text="${object.objectTypeName}"></td>
                                    <td th:text="${object.objectInstance}"></td>
                                    <td th:text="${object.objectName}"></td>
                                    <td th:text="${object.presentValue ?: 'N/A'}"></td>
                                    <td>
                                        <span th:if="${object.writable}" class="badge bg-success">Yes</span>
                                        <span th:unless="${object.writable}" class="badge bg-secondary">No</span>
                                    </td>
                                    <td>
                                        <span th:if="${object.covEnabled}" class="badge bg-info">Enabled</span>
                                        <span th:unless="${object.covEnabled}" class="badge bg-secondary">Disabled</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/objects/{id}/edit(id=${object.id})}" class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-pencil"></i> Edit
                                        </a>
                                        <form th:action="@{/objects/{id}/delete(id=${object.id})}" method="post" style="display: inline;">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" 
                                                    onclick="return confirm('Are you sure you want to delete this object?')">
                                                <i class="bi bi-trash"></i> Delete
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${objects.isEmpty()}">
                                    <td colspan="8" class="text-center text-muted">No objects found. <a th:href="@{/objects/create}">Create one</a></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
